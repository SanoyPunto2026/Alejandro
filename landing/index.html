<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alejandro Ruiz</title>
  <meta name="description" content="Espacio personal de Alejandro Ruiz, bajo la marca Sano y Punto.">
  <link rel="icon" href="/tesis/favicon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#faf7f2;color:#1f2a24}
    main{max-width:480px;width:100%}
    h1{font-size:2rem;margin:0 0 .25rem}
    p{margin:0 0 1.5rem;color:#55645b}
    a.card{display:block;padding:16px 18px;border:1px solid #e3ddd0;border-radius:12px;
      background:#fff;color:inherit;text-decoration:none;transition:border-color .15s}
    a.card:hover{border-color:#2f7d4f}
    a.card strong{display:block}
    a.card span{font-size:.9rem;color:#55645b}
    @media (prefers-color-scheme:dark){
      body{background:#141a16;color:#eef2ee}
      p,a.card span{color:#a7b4ab}
      a.card{background:#1b231e;border-color:#2b362f}
    }
  </style>
</head>
<body>
  <main>
    <h1>Alejandro Ruiz</h1>
    <p>Mi espacio personal, bajo la marca Sano y Punto.</p>
    <a class="card" href="/tesis/">
      <strong>Tesis</strong>
      <span>Presentación de mi trabajo de grado</span>
    </a>
  </main>
</body>
</html>
